<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono Focus · Codex do tempo</title>
    <meta name="description"
        content="Chrono Focus: um codex romano para organizar seus estudos, traçar o cronograma e medir o foco com uma ampulheta.">
    <meta name="theme-color" content="#f6efe0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141009" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" href="./assets/images/icons/logo.png">
    <link rel="apple-touch-icon" href="./assets/images/icons/logo.png">

    <script type="module" src="./js/pages/router.js"></script>
    <script type="module" src="./js/main.js"></script>
    <link rel="stylesheet" href="./css/main.css?v=5">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&amp;family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="scroll-rail" id="scroll-rail" aria-hidden="true"><span></span></div>
    <a class="skip-link" href="#activity">Pular para o conteúdo</a>

    <!-- ============================================================
         SPRITE: ícones e cenas vetoriais (traço fino / relevo romano)
         ============================================================ -->
    <svg width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden;" aria-hidden="true">
        <defs>
            <!-- Ajustes (sliders: leitura imediata) -->
            <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 7h9M18.5 7H20M4 17h4M13.5 17H20" />
                <circle cx="15.5" cy="7" r="2" />
                <circle cx="10.5" cy="17" r="2" />
            </symbol>
            <!-- Pausa -->
            <symbol id="icon-pause" viewBox="0 0 24 24">
                <rect x="8" y="5" width="3" height="14" rx="1.5" fill="currentColor" />
                <rect x="14" y="5" width="3" height="14" rx="1.5" fill="currentColor" />
            </symbol>
            <!-- Encerrar -->
            <symbol id="icon-stop" viewBox="0 0 24 24">
                <rect x="6.5" y="6.5" width="11" height="11" rx="2.4" fill="currentColor" />
            </symbol>
            <!-- Retomar -->
            <symbol id="icon-play" viewBox="0 0 24 24">
                <path d="M8.5 5.2 19 12 8.5 18.8Z" fill="currentColor" />
            </symbol>

            <!-- Cena para estado vazio: fórum romano em blocos de cor -->
            <symbol id="art-empty-forum" viewBox="0 0 320 200">
                <circle cx="58" cy="46" r="22" fill="var(--yellow)" />
                <path d="M0 200c34-26 62-44 96-58 40-16 78-22 116-16 42 6 74 22 108 42v32Z"
                    fill="var(--brand-soft)" />
                <g fill="var(--brand)">
                    <path d="M86 92h148v8H86zM96 100h128v8H96z" />
                    <path d="M104 108h12v58h-12zM132 108h12v58h-12zM160 108h12v58h-12zM188 108h12v58h-12zM216 108h12v58h-12z" />
                    <path d="M98 166h124v8H98zM90 174h140v8H90z" />
                </g>
                <path d="M80 92 160 52l80 40Z" fill="var(--gold)" />
                <path d="M96 92 160 60l64 32Z" fill="var(--marble-2)" />
                <g fill="var(--verdigris)">
                    <path d="M52 196c-14-8-20-22-18-40 12 6 20 18 22 34Z" />
                    <path d="M62 196c8-14 10-28 4-42-10 8-14 22-10 38Z" />
                    <path d="M70 196c14-6 22-18 24-34-14 4-24 16-28 30Z" />
                </g>
                <g fill="var(--lapis)">
                    <path d="M264 168c-8-6-10-16-6-26 6 2 10 8 12 16 4-8 8-12 14-14 4 12 0 22-8 28 8 0 14 2 18 6-10 6-22 6-30-2Z" />
                </g>
                <g fill="var(--terracotta)">
                    <circle cx="286" cy="42" r="3" /><circle cx="298" cy="42" r="3" /><circle cx="286" cy="54" r="3" />
                    <circle cx="298" cy="54" r="3" /><circle cx="286" cy="66" r="3" /><circle cx="298" cy="66" r="3" />
                </g>
                <g fill="var(--yellow)">
                    <circle cx="34" cy="120" r="2.6" /><circle cx="46" cy="120" r="2.6" /><circle cx="34" cy="132" r="2.6" />
                    <circle cx="46" cy="132" r="2.6" />
                </g>
            </symbol>

            <!-- Coluna Dórica (Matérias / Pilares do estudo) -->
            <symbol id="icon-pillar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3h18M5.5 6h13M7 6v12M12 6v12M17 6v12M6 18h12M4.5 21h15" />
            </symbol>
            <!-- Pergaminho / Codex (Assuntos / Notas de retomada) -->
            <symbol id="icon-scroll" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M8 3h10a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2v9a3 3 0 0 1-3 3H6a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2h2V5a2 2 0 0 1 2-2Z" />
                <path d="M11 8h3M11 12h3" />
            </symbol>
            <!-- Sol / Quadrante Solar (Rotina / Hoje / Jornada) -->
            <symbol id="icon-sundial" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4" />
                <path
                    d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </symbol>
            <!-- Ramo de Louros (Conquista / Revisão / Sessão concluída) -->
            <symbol id="icon-laurel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 20c-3-3-4-8-2-13M17 20c3-3 4-8 2-13" />
                <path d="M5 12c2 0 3 1 3 3M5 8c2 0 3 1 3 3M19 12c-2 0-3 1-3 3M19 8c-2 0-3 1-3 3" />
            </symbol>
            <!-- Ampulheta (Foco / tempo medido) -->
            <symbol id="icon-clepsydra" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 3h12M6 21h12M8 3c0 5 4 6.5 4 9s-4 4-4 9M16 3c0 5-4 6.5-4 9s4 4 4 9" />
                <path d="M9 7h6" opacity=".55" />
            </symbol>
            <!-- Ânfora (Pausa / otium) -->
            <symbol id="icon-amphora" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 3h6M10 3v3c-2 2-3 4.5-3 7 0 4 2 6 5 6s5-2 5-6c0-2.5-1-5-3-7V3" />
                <path d="M7 9c-1.5.4-2 1.4-1 2.4M17 9c1.5.4 2 1.4 1 2.4M12 20v2" />
            </symbol>
            <!-- Arco / Aqueduto (Cronograma / fastos) -->
            <symbol id="icon-arch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 21V9a9 9 0 0 1 18 0v12" />
                <path d="M7 21V10a5 5 0 0 1 10 0v11M3 21h18" />
            </symbol>

            <!-- =====================================================
                 CENA: Roma em silhueta (original, uso livre — CC0)
                 Templo, aqueduto, ciprestes, colinas e sol.
                 ===================================================== -->
            <symbol id="art-rome-skyline" viewBox="0 0 900 240">
                <g fill="currentColor">
                    <!-- sol e raios -->
                    <g opacity=".85">
                        <circle cx="762" cy="54" r="24" />
                        <g stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity=".8">
                            <path d="M762 18v-9M762 90v9M726 54h-9M798 54h9" />
                            <path d="M737 29l-6-6M787 29l6-6M737 79l-6 6M787 79l6 6" />
                        </g>
                    </g>
                    <!-- aves -->
                    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".55">
                        <path d="M604 78q7-7 14 0q7-7 14 0" />
                        <path d="M648 60q5-5 10 0q5-5 10 0" />
                    </g>
                    <!-- colinas -->
                    <path opacity=".22"
                        d="M0 198C90 170 168 192 258 176c118-22 208 14 328 0 110-13 210 6 314-4v68H0Z" />
                    <!-- templo -->
                    <g opacity=".92">
                        <path d="M68 78h224v10H68z" />
                        <path d="M70 78 180 34l110 44Z" />
                        <path d="M84 78 180 43l96 35Z" fill="none" stroke="currentColor" stroke-width="2"
                            opacity=".45" />
                        <circle cx="180" cy="31" r="4.5" />
                        <path d="M76 88h208v10H76z" />
                        <g>
                            <path d="M86 98h16v80H86zM126 98h16v80h-16zM166 98h16v80h-16zM206 98h16v80h-16zM246 98h16v80h-16z" />
                            <path d="M83 94h22v6H83zM123 94h22v6h-22zM163 94h22v6h-22zM203 94h22v6h-22zM243 94h22v6h-22z" />
                        </g>
                        <path d="M74 178h212v8H74zM62 186h236v8H62zM52 194h256v8H52z" />
                    </g>
                    <!-- ciprestes -->
                    <g opacity=".8">
                        <path d="M340 200c-9-30-9-74 0-102 9 28 9 72 0 102Z" />
                        <path d="M368 200c-7-24-7-58 0-80 7 22 7 56 0 80Z" />
                        <path d="M872 200c-8-27-8-66 0-91 8 25 8 64 0 91Z" />
                    </g>
                    <!-- aqueduto -->
                    <g opacity=".85">
                        <path d="M426 140h458v8H426z" />
                        <path fill-rule="evenodd"
                            d="M430 152H880v52H430Zm20 52v-18a20 20 0 0 1 40 0v18Zm70 0v-18a20 20 0 0 1 40 0v18Zm70 0v-18a20 20 0 0 1 40 0v18Zm70 0v-18a20 20 0 0 1 40 0v18Zm70 0v-18a20 20 0 0 1 40 0v18Zm70 0v-18a20 20 0 0 1 40 0v18Z" />
                        <path d="M424 204h462v8H424z" />
                    </g>
                </g>
            </symbol>
        </defs>
    </svg>

    <aside class="rail" aria-label="Navegação principal">
        <div class="rail-brand">
            <svg class="icon" aria-hidden="true"><use href="#icon-laurel" /></svg>
            <span>Chrono Focus</span>
        </div>
        <nav class="rail-nav">
            <button type="button" class="rail-link" data-page-link="home">
                <svg class="icon" aria-hidden="true"><use href="#icon-sundial" /></svg><span>Hoje</span>
            </button>
            <button type="button" class="rail-link" data-page-link="subjects">
                <svg class="icon" aria-hidden="true"><use href="#icon-pillar" /></svg><span>Matérias</span>
            </button>
            <button type="button" class="rail-link" data-page-link="schedule">
                <svg class="icon" aria-hidden="true"><use href="#icon-arch" /></svg><span>Cronograma</span>
            </button>
        </nav>
        <p class="rail-foot">Consistência acima da perfeição.</p>
    </aside>

    <main id="activity" tabindex="-1">
        <noscript>
            <section class="page-content">
                <h1>Chrono Focus</h1>
                <p>Ative o JavaScript para abrir este codex.</p>
            </section>
        </noscript>
    </main>

    <!-- ============================================================
         PARCIAL: AMPULHETA (clepsidra) — clonada em JS nas telas de foco
         ============================================================ -->
    <template id="clepsydra-template">
        <figure class="clepsydra" data-phase="focus">
            <svg class="clepsydra-svg" viewBox="36 0 128 300" aria-hidden="true" focusable="false">
                <defs>
                    <linearGradient id="clepsBrass" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" style="stop-color: var(--brass-hi)" />
                        <stop offset=".5" style="stop-color: var(--brass)" />
                        <stop offset="1" style="stop-color: var(--brass-lo)" />
                    </linearGradient>
                    <linearGradient id="clepsSand" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" style="stop-color: var(--sand-hi)" />
                        <stop offset=".09" style="stop-color: var(--sand-mid)" />
                        <stop offset="1" style="stop-color: var(--sand-lo)" />
                    </linearGradient>
                    <clipPath id="clepsClipTop">
                        <path d="M56 20C56 70 84 106 100 150 116 106 144 70 144 20Z" />
                    </clipPath>
                    <clipPath id="clepsClipBottom">
                        <path d="M56 280C56 230 84 194 100 150 116 194 144 230 144 280Z" />
                    </clipPath>
                </defs>

                <g class="clepsydra-clock">
                    <g class="clepsydra-frame">
                        <rect x="46" y="6" width="108" height="10" rx="4" fill="url(#clepsBrass)" stroke="var(--brass-line)" stroke-width=".7" />
                        <rect x="46" y="284" width="108" height="10" rx="4" fill="url(#clepsBrass)" stroke="var(--brass-line)" stroke-width=".7" />
                        <rect x="46" y="16" width="5" height="268" rx="2.5" fill="url(#clepsBrass)" />
                        <rect x="149" y="16" width="5" height="268" rx="2.5" fill="url(#clepsBrass)" />
                        <rect x="56" y="16" width="88" height="4" rx="2" fill="var(--brass-lo)" />
                        <rect x="56" y="280" width="88" height="4" rx="2" fill="var(--brass-lo)" />
                    </g>

                    <g class="clepsydra-body">
                        <path d="M56 20C56 70 84 106 100 150 116 106 144 70 144 20Z" fill="var(--glass)"
                            stroke="var(--glass-line)" stroke-width="1.6" stroke-linejoin="round" />
                        <path d="M56 280C56 230 84 194 100 150 116 194 144 230 144 280Z" fill="var(--glass)"
                            stroke="var(--glass-line)" stroke-width="1.6" stroke-linejoin="round" />

                        <g class="clepsydra-sand">
                            <g clip-path="url(#clepsClipTop)">
                                <rect class="sand-top" x="36" y="6" width="128" height="146" fill="url(#clepsSand)" />
                            </g>
                            <g clip-path="url(#clepsClipBottom)">
                                <rect class="sand-bottom" x="36" y="150" width="128" height="136"
                                    fill="url(#clepsSand)" />
                            </g>
                            <g class="sand-flow">
                                <line class="stream-line" x1="100" y1="150" x2="100" y2="266"
                                    stroke="var(--sand-lo)" stroke-width="2.2" stroke-linecap="round" />
                                <circle class="grain grain-1" cx="100" cy="156" r="1.5" fill="var(--sand-hi)" />
                                <circle class="grain grain-2" cx="100" cy="156" r="1.3" fill="var(--sand-hi)" />
                                <circle class="grain grain-3" cx="100" cy="156" r="1.1" fill="var(--sand-hi)" />
                            </g>
                        </g>

                        <g class="clepsydra-glint" aria-hidden="true">
                            <path d="M70 28C72 62 86 92 96 128" fill="none" stroke="var(--glint)" stroke-width="4.5"
                                stroke-linecap="round" opacity=".4" />
                            <path d="M72 272C76 240 88 210 98 176" fill="none" stroke="var(--glint)"
                                stroke-width="3.5" stroke-linecap="round" opacity=".28" />
                        </g>
                    </g>
                </g>
            </svg>
        </figure>
    </template>

    <!-- ============================================================
         TELA 1: BOAS-VINDAS
         ============================================================ -->
    <template data-page="welcome">
        <section class="page-content welcome-screen" aria-labelledby="welcome-title">
            <div class="skyline" aria-hidden="true">
                <svg viewBox="0 0 900 240" preserveAspectRatio="xMidYMax slice">
                    <use href="#art-rome-skyline" />
                </svg>
            </div>

            <article class="welcome-hero">

                <figure class="logo-container">
                    <svg class="logo-svg" viewBox="0 0 180 150" role="img"
                        aria-label="Ampulheta cercada por coroa de louros">
                        <image class="laurel-crown-img" href="./assets/images/icons/laurel-crown.png" x="12" y="8"
                            width="156" height="134" preserveAspectRatio="xMidYMid meet" />

                        <!-- Ampulheta grega (klepsydra) animada no centro da coroa -->
                        <g class="klepsydra">
                            <rect x="60" y="28" width="60" height="5" rx="2.5"
                                stroke-width="1.2" style="fill: var(--brass); stroke: var(--brass-line)" />
                            <rect x="60" y="113" width="60" height="5" rx="2.5"
                                stroke-width="1.2" style="fill: var(--brass); stroke: var(--brass-line)" />
                            <path d="M66 33C66 52 82 62 90 72 98 62 114 52 114 33Z"
                                stroke-width="1.6"
                                stroke-linejoin="round" style="fill: var(--glass-hi); stroke: var(--glass-line)" />
                            <path d="M66 113C66 94 82 84 90 74 98 84 114 94 114 113Z"
                                stroke-width="1.6"
                                stroke-linejoin="round" style="fill: var(--glass-hi); stroke: var(--glass-line)" />
                            <path class="sand-top" d="M71 41C73 53 84 60 90 70 96 60 107 53 109 41Z" style="fill: var(--sand-lo)" />
                            <line class="sand-stream" x1="90" y1="72" x2="90" y2="110"
                                stroke-width="2" stroke-linecap="round" style="stroke: var(--sand-lo)" />
                            <path class="sand-bottom" d="M71 112C77 99 84 95 90 95 96 95 103 99 109 112Z" style="fill: var(--sand-lo)" />
                        </g>
                    </svg>
                </figure>

                <hgroup class="welcome-text">
                    <h1 id="welcome-title">Chrono Focus</h1>
                    <p class="welcome-motto">Consistência acima da perfeição.</p>
                    <p class="epigraph">Gutta cavat lapidem.</p>
                </hgroup>

                <div class="welcome-actions">
                    <button type="button" id="welcome-start" class="btn btn-primary btn-lg">Começar</button>
                    <button type="button" id="welcome-skip" class="btn btn-terciary">pular (modo dev)</button>
                </div>
            </article>
        </section>
    </template>

    <!-- ============================================================
         TELA 2: ETAPA 1 — ROTINA E DIAS
         ============================================================ -->
    <template data-page="questionnaire-days">
        <header class="header-sequence">
            <nav aria-label="Etapas do planejamento">
                <ol class="steps">
                    <li class="step active" aria-current="step">
                        <span class="step-numeral">I</span><span class="step-label">Rotina</span>
                    </li>
                    <li class="step">
                        <span class="step-numeral">II</span><span class="step-label">Matérias</span>
                    </li>
                    <li class="step">
                        <span class="step-numeral">III</span><span class="step-label">Cronograma</span>
                    </li>
                    <li class="step">
                        <span class="step-numeral">IV</span><span class="step-label">Revisão</span>
                    </li>
                </ol>
            </nav>
        </header>

        <section class="page-content" aria-labelledby="routine-days-heading">
            <div class="page-heading"><h1>Sua rotina</h1>
            </div>

            <fieldset aria-describedby="routine-days-error">
                <legend id="routine-days-heading">Dias de estudo</legend>
                <div class="checkbox-container day-picker" role="group" aria-label="Dias da semana">
                    <button type="button" class="checkbox-button day-button" data-day="seg" aria-pressed="false">
                        <span class="day-roman">Lun</span><span class="day-short">seg</span>
                    </button>
                    <button type="button" class="checkbox-button day-button" data-day="ter" aria-pressed="false">
                        <span class="day-roman">Mar</span><span class="day-short">ter</span>
                    </button>
                    <button type="button" class="checkbox-button day-button" data-day="qua" aria-pressed="false">
                        <span class="day-roman">Mer</span><span class="day-short">qua</span>
                    </button>
                    <button type="button" class="checkbox-button day-button" data-day="qui" aria-pressed="false">
                        <span class="day-roman">Iov</span><span class="day-short">qui</span>
                    </button>
                    <button type="button" class="checkbox-button day-button" data-day="sex" aria-pressed="false">
                        <span class="day-roman">Ven</span><span class="day-short">sex</span>
                    </button>
                    <button type="button" class="checkbox-button day-button" data-day="sab" aria-pressed="false">
                        <span class="day-roman">Sat</span><span class="day-short">sáb</span>
                    </button>
                    <button type="button" class="checkbox-button day-button" data-day="dom" aria-pressed="false">
                        <span class="day-roman">Sol</span><span class="day-short">dom</span>
                    </button>
                </div>
                <p id="routine-days-error" class="text-danger" role="alert"></p>
                <p class="text-info"><span aria-hidden="true">✦</span> Reserve ao menos um dia de descanso na semana — até
                    os romanos tinham os seus.</p>
            </fieldset>

            <section id="study-preference-container" class="card-column" aria-labelledby="study-preference-heading">
                <h2 id="study-preference-heading">Tempo de estudo</h2>
                <p id="routine-preference-error" class="text-danger" role="alert"></p>

                <div id="preference-choice" class="actions-row preference-choice">
                    <button type="button" id="preference-fixed-time" aria-controls="fixed-time-panel"
                        aria-expanded="false" class="btn btn-choose">
                        <svg class="icon-inline" aria-hidden="true"><use href="#icon-sundial" /></svg>
                        Horário fixo
                        <span class="btn-sub">Começo e fim definidos</span>
                    </button>
                    <p class="choice-sep" aria-hidden="true">ou</p>
                    <button type="button" id="preference-period" aria-controls="period-panel" aria-expanded="false"
                        class="btn btn-choose">
                        <svg class="icon-inline" aria-hidden="true"><use href="#icon-scroll" /></svg>
                        Período do dia
                        <span class="btn-sub">Manhã, tarde ou noite</span>
                    </button>
                </div>

                <section id="fixed-time-panel" class="card-column hidden" aria-labelledby="fixed-time-heading">
                    <h3 id="fixed-time-heading">Quanto tempo você reserva em cada dia?</h3>
                    <button type="button" id="preference-back-fixed-time" class="btn btn-secondary">Voltar</button>
                </section>

                <section id="period-panel" class="card-column hidden" aria-label="Seleção de período">
                    <fieldset class="study-time-mode">
                        <legend>Em que período você rende mais?</legend>
                        <div class="checkbox-container period-picker">
                            <label><input type="radio" name="periodos" value="morning"> Manhã</label>
                            <label><input type="radio" name="periodos" value="afternoon"> Tarde</label>
                            <label><input type="radio" name="periodos" value="night"> Noite</label>
                        </div>

                <input type="text" id="topic-name" class="input-txt" name="topic-name" placeholder="Digite um assunto"
                    required>
                <button type="submit" class="btn btn-primary" aria-label="Adicionar assunto">+</button>
            </div>
            <p id="topic-error" class="text-danger" role="alert"></p>
            <p id="topic-confirmation" class="text-success hidden" aria-live="polite"></p>
            <button type="button" id="topic-dialog-close" class="btn btn-secondary">Fechar</button>
        </form>
    </dialog>
</body>

</html>
